<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="Mailmark">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <clipPath id="envClip">
      <rect x="3" y="9" width="54" height="42" rx="6"/>
    </clipPath>
  </defs>

  <!-- White fill -->
  <rect x="3" y="9" width="54" height="42" rx="6" fill="white"/>

  <!-- Envelope body outline -->
  <rect x="3" y="9" width="54" height="42" rx="6"
        fill="none" stroke="url(#grad)" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- M-letter fold lines -->
  <line x1="3"  y1="9" x2="30" y2="33"
        stroke="url(#grad)" stroke-width="5.5" stroke-linecap="round" clip-path="url(#envClip)"/>
  <line x1="57" y1="9" x2="30" y2="33"
        stroke="url(#grad)" stroke-width="5.5" stroke-linecap="round" clip-path="url(#envClip)"/>

  <!-- White cutout ring -->
  <circle cx="55" cy="49" r="16" fill="white"/>

  <!-- Badge circle — inset into envelope -->
  <circle cx="55" cy="49" r="14" fill="url(#grad)"/>

  <!-- White checkmark -->
  <polyline points="47,49 53,55 64,41"
            fill="none" stroke="white" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="82" y="48"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#7c3aed">Mail</tspan><tspan fill="#1e1b4b">mark</tspan>
  </text>
</svg>
