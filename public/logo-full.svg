<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="Mailmark">
  <defs>
    <linearGradient id="mGradF" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Icon: circuit M (fits in 0 0 80 80) -->
  <!-- Left outer leg -->
  <line x1="8" y1="72" x2="8" y2="12" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>
  <!-- Left top horizontal connector -->
  <line x1="8" y1="12" x2="22" y2="12" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>
  <!-- Left diagonal to V center -->
  <line x1="22" y1="12" x2="40" y2="38" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>
  <!-- Left inner leg down from V -->
  <line x1="40" y1="38" x2="29" y2="72" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>

  <!-- Right inner leg down from V -->
  <line x1="40" y1="38" x2="51" y2="72" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>
  <!-- Right diagonal to V center -->
  <line x1="58" y1="12" x2="40" y2="38" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>
  <!-- Right top horizontal connector -->
  <line x1="58" y1="12" x2="72" y2="12" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>
  <!-- Right outer leg -->
  <line x1="72" y1="12" x2="72" y2="72" stroke="url(#mGradF)" stroke-width="3" stroke-linecap="round"/>

  <!-- Circuit dots — bottom feet -->
  <circle cx="8"  cy="72" r="3.5" fill="url(#mGradF)"/>
  <circle cx="29" cy="72" r="3.5" fill="url(#mGradF)"/>
  <circle cx="51" cy="72" r="3.5" fill="url(#mGradF)"/>
  <circle cx="72" cy="72" r="3.5" fill="url(#mGradF)"/>
  <!-- V center dot -->
  <circle cx="40" cy="38" r="3.5" fill="url(#mGradF)"/>
  <!-- Top corner dots -->
  <circle cx="8"  cy="12" r="3.5" fill="url(#mGradF)"/>
  <circle cx="22" cy="12" r="3.5" fill="url(#mGradF)"/>
  <circle cx="58" cy="12" r="3.5" fill="url(#mGradF)"/>
  <circle cx="72" cy="12" r="3.5" fill="url(#mGradF)"/>

  <!-- Wordmark -->
  <text
    x="90"
    y="52"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-0.5"
  >
    <tspan fill="#7c3aed">Mail</tspan><tspan fill="#1e1b4b">mark</tspan>
  </text>
</svg>
