<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="DevMail">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Icon mark (64x64 square) -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#iconGrad)"/>

  <!-- Envelope body -->
  <rect x="9" y="17" width="46" height="31" rx="3" fill="white" opacity="0.96"/>

  <!-- Envelope flap crease -->
  <path d="M9 17 L32 35 L55 17" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code tag: < / > -->
  <!-- Left < -->
  <path d="M19 40 L14 44 L19 48" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <!-- Slash / -->
  <line x1="28" y1="40" x2="35" y2="48" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" opacity="0.65"/>
  <!-- Right > -->
  <path d="M45 40 L50 44 L45 48" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- Wordmark: "DevMail" -->
  <!-- "Dev" prefix in lighter violet -->
  <text
    x="80"
    y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="26"
    font-weight="800"
    fill="#7c3aed"
    letter-spacing="-0.5"
  >Dev</text>
  <!-- "Mail" suffix in dark -->
  <text
    x="126"
    y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="26"
    font-weight="800"
    fill="#1e1b4b"
    letter-spacing="-0.5"
  >Mail</text>
</svg>
