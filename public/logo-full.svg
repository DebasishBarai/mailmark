<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="Mailmark">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <clipPath id="envClip">
      <rect x="3" y="10" width="55" height="42" rx="6"/>
    </clipPath>
  </defs>

  <!-- Envelope body outline -->
  <rect x="3" y="10" width="55" height="42" rx="6"
        fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Envelope fold lines -->
  <line x1="3" y1="10" x2="58" y2="52" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" clip-path="url(#envClip)"/>
  <line x1="58" y1="10" x2="3"  y2="52" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" clip-path="url(#envClip)"/>

  <!-- Badge circle -->
  <circle cx="62" cy="58" r="16" fill="url(#grad)"/>

  <!-- White checkmark -->
  <polyline points="54,58 60,64 71,50"
            fill="none" stroke="white" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="88" y="50"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#7c3aed">Mail</tspan><tspan fill="#1e1b4b">mark</tspan>
  </text>
</svg>
