<!DOCTYPE html>
<html>
<body style="background:#f3f4f6; padding:48px; font-family:sans-serif;">

  <h2 style="color:#1e1b4b; margin-bottom:32px;">Mailmark — New Logo</h2>

  <div style="display:flex; gap:48px; align-items:center; flex-wrap:wrap;">

    <!-- Icon on white -->
    <div style="text-align:center">
      <div style="background:white; padding:24px; border-radius:16px; display:inline-block; box-shadow:0 2px 12px rgba(0,0,0,.08)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#5b21b6"/>
            </linearGradient>
          </defs>
          <line x1="10" y1="90" x2="10" y2="15" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="10" y1="15" x2="27" y2="15" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="27" y1="15" x2="50" y2="48" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="50" y1="48" x2="36" y2="90" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="50" y1="48" x2="64" y2="90" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="73" y1="15" x2="50" y2="48" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="73" y1="15" x2="90" y2="15" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="90" y1="15" x2="90" y2="90" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="10" cy="90" r="4.5" fill="url(#g1)"/>
          <circle cx="36" cy="90" r="4.5" fill="url(#g1)"/>
          <circle cx="64" cy="90" r="4.5" fill="url(#g1)"/>
          <circle cx="90" cy="90" r="4.5" fill="url(#g1)"/>
          <circle cx="50" cy="48" r="4.5" fill="url(#g1)"/>
          <circle cx="10" cy="15" r="4.5" fill="url(#g1)"/>
          <circle cx="27" cy="15" r="4.5" fill="url(#g1)"/>
          <circle cx="73" cy="15" r="4.5" fill="url(#g1)"/>
          <circle cx="90" cy="15" r="4.5" fill="url(#g1)"/>
        </svg>
      </div>
      <p style="margin:10px 0 0;color:#6b7280;font-size:13px">Icon — on white</p>
    </div>

    <!-- Icon on dark -->
    <div style="text-align:center">
      <div style="background:#1e1b4b; padding:24px; border-radius:16px; display:inline-block; box-shadow:0 2px 12px rgba(0,0,0,.2)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
          <defs>
            <linearGradient id="g2" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c4b5fd"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <line x1="10" y1="90" x2="10" y2="15" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="10" y1="15" x2="27" y2="15" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="27" y1="15" x2="50" y2="48" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="50" y1="48" x2="36" y2="90" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="50" y1="48" x2="64" y2="90" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="73" y1="15" x2="50" y2="48" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="73" y1="15" x2="90" y2="15" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="90" y1="15" x2="90" y2="90" stroke="url(#g2)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="10" cy="90" r="4.5" fill="url(#g2)"/>
          <circle cx="36" cy="90" r="4.5" fill="url(#g2)"/>
          <circle cx="64" cy="90" r="4.5" fill="url(#g2)"/>
          <circle cx="90" cy="90" r="4.5" fill="url(#g2)"/>
          <circle cx="50" cy="48" r="4.5" fill="url(#g2)"/>
          <circle cx="10" cy="15" r="4.5" fill="url(#g2)"/>
          <circle cx="27" cy="15" r="4.5" fill="url(#g2)"/>
          <circle cx="73" cy="15" r="4.5" fill="url(#g2)"/>
          <circle cx="90" cy="15" r="4.5" fill="url(#g2)"/>
        </svg>
      </div>
      <p style="margin:10px 0 0;color:#6b7280;font-size:13px">Icon — on dark</p>
    </div>

    <!-- Full wordmark -->
    <div style="text-align:center">
      <div style="background:white; padding:20px 32px; border-radius:16px; display:inline-block; box-shadow:0 2px 12px rgba(0,0,0,.08)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80">
          <defs>
            <linearGradient id="g3" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#a78bfa"/>

          </defs>
          <line x1="8" y1="72" x2="8" y2="12" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="8" y1="12" x2="22" y2="12" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="22" y1="12" x2="40" y2="38" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="38" x2="29" y2="72" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="38" x2="51" y2="72" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="58" y1="12" x2="40" y2="38" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="58" y1="12" x2="72" y2="12" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <line x1="72" y1="12" x2="72" y2="72" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="8"  cy="72" r="3.5" fill="url(#g3)"/>
          <circle cx="29" cy="72" r="3.5" fill="url(#g3)"/>
          <circle cx="51" cy="72" r="3.5" fill="url(#g3)"/>
          <circle cx="72" cy="72" r="3.5" fill="url(#g3)"/>
          <circle cx="40" cy="38" r="3.5" fill="url(#g3)"/>
          <circle cx="8"  cy="12" r="3.5" fill="url(#g3)"/>
          <circle cx="22" cy="12" r="3.5" fill="url(#g3)"/>
          <circle cx="58" cy="12" r="3.5" fill="url(#g3)"/>
          <circle cx="72" cy="12" r="3.5" fill="url(#g3)"/>
          <text x="90" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
            <tspan fill="#7c3aed">Mail</tspan><tspan fill="#1e1b4b">mark</tspan>
          </text>
        </svg>
      </div>
      <p style="margin:10px 0 0;color:#6b7280;font-size:13px">Full wordmark — on white</p>
    </div>

  </div>

  <!-- Header mockup -->
  <h3 style="color:#1e1b4b; margin:48px 0 16px;">Header preview</h3>
  <div style="background:white; padding:16px 24px; border-radius:12px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,.08); max-width:400px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36">
      <defs>
        <linearGradient id="g4" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#5b21b6"/>
        </linearGradient>
      </defs>
      <line x1="10" y1="90" x2="10" y2="15" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="15" x2="27" y2="15" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="27" y1="15" x2="50" y2="48" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="50" y1="48" x2="36" y2="90" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="50" y1="48" x2="64" y2="90" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="73" y1="15" x2="50" y2="48" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="73" y1="15" x2="90" y2="15" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="90" y1="15" x2="90" y2="90" stroke="url(#g4)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="10" cy="90" r="4.5" fill="url(#g4)"/>
      <circle cx="36" cy="90" r="4.5" fill="url(#g4)"/>
      <circle cx="64" cy="90" r="4.5" fill="url(#g4)"/>
      <circle cx="90" cy="90" r="4.5" fill="url(#g4)"/>
      <circle cx="50" cy="48" r="4.5" fill="url(#g4)"/>
      <circle cx="10" cy="15" r="4.5" fill="url(#g4)"/>
      <circle cx="27" cy="15" r="4.5" fill="url(#g4)"/>
      <circle cx="73" cy="15" r="4.5" fill="url(#g4)"/>
      <circle cx="90" cy="15" r="4.5" fill="url(#g4)"/>
    </svg>
    <span style="font-size:22px; font-weight:800; color:#7c3aed; font-family:system-ui,sans-serif; letter-spacing:-0.5px">Mailmark</span>
  </div>

</body>
</html>
