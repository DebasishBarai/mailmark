<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Mailmark logo option C">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGradC)"/>
  <!-- Bold M lettermark that subtly echoes an envelope peak -->
  <!-- Left leg -->
  <path d="M18 74 L18 30" stroke="white" stroke-width="11" stroke-linecap="round"/>
  <!-- Left diagonal down to center -->
  <path d="M18 30 L50 56" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right diagonal up from center -->
  <path d="M50 56 L82 30" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <path d="M82 30 L82 74" stroke="white" stroke-width="11" stroke-linecap="round"/>
</svg>
