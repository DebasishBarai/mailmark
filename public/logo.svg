<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Mailmark logo">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <!-- clip envelope contents to envelope shape -->
    <clipPath id="envClip">
      <rect x="4" y="16" width="68" height="52" rx="8"/>
    </clipPath>
  </defs>

  <!-- Envelope body outline -->
  <rect x="4" y="16" width="68" height="52" rx="8"
        fill="none" stroke="url(#grad)" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- Envelope fold lines (X pattern clipped inside) -->
  <line x1="4" y1="16" x2="72" y2="68" stroke="url(#grad)" stroke-width="5.5" stroke-linecap="round" clip-path="url(#envClip)"/>
  <line x1="72" y1="16" x2="4"  y2="68" stroke="url(#grad)" stroke-width="5.5" stroke-linecap="round" clip-path="url(#envClip)"/>

  <!-- Badge circle (bottom-right, overlapping envelope corner) -->
  <circle cx="76" cy="76" r="20" fill="url(#grad)"/>

  <!-- White checkmark inside badge -->
  <polyline points="66,76 73,83 87,67"
            fill="none" stroke="white" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
