<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Mailmark logo">
  <defs>
    <linearGradient id="mGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Left outer leg -->
  <line x1="10" y1="90" x2="10" y2="15" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left top horizontal connector -->
  <line x1="10" y1="15" x2="27" y2="15" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left diagonal down to V center -->
  <line x1="27" y1="15" x2="50" y2="48" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left inner leg down from V -->
  <line x1="50" y1="48" x2="36" y2="90" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right inner leg down from V -->
  <line x1="50" y1="48" x2="64" y2="90" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right diagonal down to V center -->
  <line x1="73" y1="15" x2="50" y2="48" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right top horizontal connector -->
  <line x1="73" y1="15" x2="90" y2="15" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right outer leg -->
  <line x1="90" y1="15" x2="90" y2="90" stroke="url(#mGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Circuit dots — bottom feet -->
  <circle cx="10" cy="90" r="4.5" fill="url(#mGrad)"/>
  <circle cx="36" cy="90" r="4.5" fill="url(#mGrad)"/>
  <circle cx="64" cy="90" r="4.5" fill="url(#mGrad)"/>
  <circle cx="90" cy="90" r="4.5" fill="url(#mGrad)"/>
  <!-- Circuit dots — V center -->
  <circle cx="50" cy="48" r="4.5" fill="url(#mGrad)"/>
  <!-- Circuit dots — top corners -->
  <circle cx="10" cy="15" r="4.5" fill="url(#mGrad)"/>
  <circle cx="27" cy="15" r="4.5" fill="url(#mGrad)"/>
  <circle cx="73" cy="15" r="4.5" fill="url(#mGrad)"/>
  <circle cx="90" cy="15" r="4.5" fill="url(#mGrad)"/>
</svg>
