<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="DevMail logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Envelope body -->
  <rect x="13" y="27" width="74" height="49" rx="5" fill="white" opacity="0.96"/>

  <!-- Envelope flap (V crease line) -->
  <path d="M13 27 L50 55 L87 27" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code tag: < / > inside the envelope body -->
  <!-- Left angle bracket < -->
  <path d="M31 63 L23 69 L31 75" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Forward slash / -->
  <line x1="45" y1="63" x2="55" y2="75" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Right angle bracket > -->
  <path d="M69 63 L77 69 L69 75" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
